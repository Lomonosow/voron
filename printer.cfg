[include macros/*.cfg]

#[include ext_accel.cfg]

[auto_chopper_tune]
accel_chip: adxl345
min_speed: 20
max_speed: 130

[mcu]
canbus_uuid: 78b04809a1b6

[mcu EBBCan]
canbus_uuid: 74dc9d65e70e

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[respond]

[pause_resume]
recover_velocity: 100

[skew_correction]

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0
unretract_speed: 30

# PB0 shared by chamber temperature_fan and z_thermal_adjust sensor
# PF4 shared by X sensorless homing diag pin
[duplicate_pin_override]
pins: PB0,ADC_TEMPERATURE,PF4

[shaketune]
result_folder: ~/printer_data/config/adxl_results
number_of_results_to_keep: 30

[exclude_object]

[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
axes_map: z,-y,x

[resonance_tester]
probe_points: 175, 175, 20
accel_chip: adxl345

[input_shaper]
#shaper_freq_x: 54.8
#shaper_type_x: mzv
#shaper_freq_y: 40.8
#shaper_type_y: mzv

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 7000
max_z_velocity: 50
max_z_accel: 350
square_corner_velocity: 5.0

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor Toolhead]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

[temperature_sensor SoC]
sensor_type: temperature_host

# XY motors: Moons MS17HD6P420I-05
# Extruder motor: Moons CSE14HRA1L410A
# Uncomment to enable TMC autotune (requires klipper-motor-db plugin)
#[autotune_tmc stepper_x]
#motor: moons-ms17hd6p420I-05
#[autotune_tmc stepper_y]
#motor: moons-ms17hd6p420I-05
#[autotune_tmc stepper_z]
#motor: moons-ms17hd6p420I-05
#[autotune_tmc stepper_z1]
#motor: moons-ms17hd6p420I-05
#[autotune_tmc stepper_z2]
#motor: moons-ms17hd6p420I-05
#[autotune_tmc stepper_z3]
#motor: moons-ms17hd6p420I-05
#[autotune_tmc extruder]
#motor: moons-cse14hra1l410a

# X/Y Steppers (TMC2240, SPI, sensorless X homing)

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
position_min: 0
position_endstop: 350
position_max: 350
endstop_pin: tmc2240_stepper_x:virtual_endstop
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: true

[tmc2240 stepper_x]
cs_pin: PC13
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 1.0
rref: 12000
driver_TOFF: 8
driver_TBL: 1
driver_HSTRT: 7
driver_HEND: 3
driver_SGT: 3
diag0_pin: ^!PF4

[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
position_min: 0
position_endstop: 350
position_max: 350
endstop_pin: ^PF3
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2240 stepper_y]
cs_pin: PE3
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 1.0
rref: 12000
driver_TOFF: 8
driver_TBL: 1
driver_HSTRT: 7
driver_HEND: 3
# driver_TOFF: 4
# driver_TBL: 2
# driver_HSTRT: 7
# driver_HEND: 6

# Z Steppers (TMC2209, UART, quad gantry)

[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 340
position_min: -5
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 3

# Required for Z lift in homing_override before axes are homed
[force_move]
enable_force_move: True

[tmc2209 stepper_z]
uart_pin: PB9
run_current: 0.8
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 0

[stepper_z1]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PB5
run_current: 0.8
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 0

[stepper_z2]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PG14
run_current: 0.8
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 0

[stepper_z3]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PG10
run_current: 0.8
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 0

# Extruder

[extruder]
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 16
rotation_distance: 22.676683205
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:gpio7
min_temp: 0
max_temp: 300
max_extrude_only_distance: 105
max_extrude_cross_section: 2
sensor_type: MAX31865
sensor_pin: EBBCan:gpio9
spi_software_sclk_pin: EBBCan:gpio10
spi_software_mosi_pin: EBBCan:gpio8
spi_software_miso_pin: EBBCan:gpio11
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
run_current: 0.65
interpolate: True

# Bed

[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PB1
max_power: 1.0
min_temp: 0
max_temp: 125

# Probe (Voron Tap - nozzle probe, no XY offset)

[probe]
pin: ^EBBCan:gpio22
x_offset: 0
y_offset: 0
lift_speed: 5
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.01
samples_tolerance_retries: 10
activate_gcode:
    {% set PROBE_TEMP = 140 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}
    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

# Fans

[fan]
pin: EBBCan:gpio13

[heater_fan hotend_fan]
pin: EBBCan:gpio14
heater: extruder
heater_temp: 70.0

[fan_generic nevermore]
pin: PF9
kick_start_time: 0.5
off_below: 0.10

[fan_generic evenmore]
pin: PF7
kick_start_time: 0.5
off_below: 0.10

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PB0
min_temp: 0
max_temp: 100

[fan_generic exhaust]
pin: PF8
kick_start_time: 0.5
off_below: 0.10

[chamber_control]
heater_fans: nevermore, evenmore
exhaust_fan: exhaust
sensor: chamber
target_temp: 0
deadband: 2.0
idle_speed: 0.2
max_speed: 1.0
on_disable: idle

[temperature_fan _mcu]
pin: PF6
sensor_type: temperature_mcu
min_temp: 0
max_temp: 70
target_temp: 50
control: watermark
max_delta: 2.0
gcode_id: mcu

[controller_fan drivers]
pin: PA4
max_power: 1.0
kick_start_time: 0.5
fan_speed: 0.9
idle_timeout: 30
idle_speed: 0.5
stepper: stepper_z,stepper_z1,stepper_z2,stepper_z3,stepper_x,stepper_y

# LEDs

[neopixel toolhead_light]
pin: EBBCan:gpio16
chain_count: 3
color_order: GRBW

[output_pin caselight]
pin: PA1
pwm: true
shutdown_value: 0
cycle_time: 0.01

# Gantry leveling and bed mesh

[quad_gantry_level]
gantry_corners:
    -60,-10
    410,420
points:
    25,25
    25,325
    325,325
    325,25
speed: 200
horizontal_move_z: 3
retries: 10
retry_tolerance: 0.0075
max_adjust: 10

[bed_mesh]
speed: 200
mesh_min: 25, 25
mesh_max: 325, 325
probe_count: 9,9
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 1
fade_end: 5
fade_target: 0
adaptive_margin: 5

[board_pins]
aliases:
    EXP1_1=PE7,  EXP1_2=PG1,
    EXP1_3=PG0,  EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,
    EXP2_7=PE8,  EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

