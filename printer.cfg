    G0 X175 Y175 Z30 F3600
    #--------------------------------------------------------------------

[gcode_macro LED_OFF]
gcode:
    SET_LED LED="toolhead_light" RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_HOMING]
gcode:
    SET_LED LED="toolhead_light" RED=0 GREEN=0 BLUE=1 WHITE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_HEATING]
gcode:
    SET_LED LED="toolhead_light" RED=1 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_PRINTING]
gcode:
    SET_LED LED="toolhead_light" RED=1 GREEN=1 BLUE=1 WHITE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_COOLING]
gcode:
    SET_LED LED="toolhead_light" RED=0 GREEN=1 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1

[gcode_macro CHAMBER_LIGHT_ON]
variable_pin_name: "caselight"
description: "Turn on chamber light"
gcode:
    {% set value = params.VALUE | default(1.0) | float %}
    RESPOND MSG="Enabling chamber light {value * 100 }%...."
    SET_PIN PIN={pin_name} VALUE={value}

[gcode_macro CHAMBER_LIGHT_OFF]
variable_pin_name: "caselight"
description: "Turn off chamber light"
gcode:
    RESPOND MSG="Disabling chamber light...."
    SET_PIN PIN={pin_name} VALUE=0

[gcode_macro CHAMBER_LIGHT_TOGGLE]
description: "Toggle chamber light"
variable_pin_name: "caselight"
gcode:
    {% set status = printer["output_pin " ~ pin_name].value %}
    {% if status > 0 %}
    CHAMBER_LIGHT_OFF
    {% else %}
    CHAMBER_LIGHT_ON
    {% endif %}

[gcode_macro PURGE_LINE]
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    RESPOND MSG="Purge line...."
    G92 E0
    # G1 X0.1 Y20 Z0.3 F5000
    # G1 X0.1 Y190.0 Z0.3 F1500.0 E15
    # G1 X0.4 Y190.0 Z0.3 F5000.0
    # G1 X0.4 Y30 Z0.3 F1500.0 E30

    G1 X20 Y20 Z0.3 F5000
    G1 X200 Y20 Z0.3 F1500.0 E15

    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

[gcode_macro NEVERMORE_TOGGLE]
variable_fan_name: "nevermore"
gcode:
    {% set status = printer["fan_generic " ~ fan_name].speed %}
    {% if status > 0 %}
    NEVERMORE_OFF
    {% else %}
    NEVERMORE_ON
    {% endif %}

[gcode_macro NEVERMORE_ON]
variable_fan_name: "nevermore"
gcode:
    RESPOND MSG="Enabling nevermore...."
    SET_FAN_SPEED FAN={fan_name} SPEED=1

[gcode_macro NEVERMORE_OFF]
variable_fan_name: "nevermore"
gcode:
    RESPOND MSG="Disabling nevermore...."
    SET_FAN_SPEED FAN={fan_name} SPEED=0

[gcode_macro HOME]
gcode:
    G28

[gcode_macro PREHEAT_ASA]
gcode:
    M104 S150
    NEVERMORE_ON
    M190 S100
    TEMPERATURE_WAIT sensor="temperature_fan chamber" minimum=45

[gcode_macro PRINT_START]
variable_bed_mesh_profile: "hot"
variable_extruder_hold_temp: 140
gcode:
    {% set target_bed = params.BED | int %}
    {% set target_extruder = params.EXTRUDER | int %}
    {% set target_chamber = params.CHAMBER | default(0) | int %}
    {% set z_offset = params.Z_OFFSET | default(0) | float %}

    BED_MESH_CLEAR
    
    CHAMBER_LIGHT_ON

    LED_HOMING

    {% if extruder_hold_temp | default() %}
    RESPOND MSG="Heating extruder to {extruder_hold_temp}...."
    M104 S{extruder_hold_temp}
    {% endif %}

    {% if printer.heater_bed.temperature > 30 %} # Stabilize bed temperature
    M140 S{ printer.heater_bed.temperature }
    {% endif %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Homing xyz...."
        G28 ; home if not already homed
    {% endif %}
    QUAD_GANTRY_LEVEL

    G90 ; Absolute coordinates

    PARK_START
    
    #{% if bed_mesh_profile | default() and not params.BED_MESH %}
    #RESPOND MSG="Loading bed profile {bed_mesh_profile}...."
    #BED_MESH_PROFILE LOAD={bed_mesh_profile}
    #{% endif %}

    LED_HEATING

    RESPOND MSG="Heating bed to {target_bed}...."
    M190 S{target_bed}
    #{% if target_bed > 85 or target_chamber %}
    #{% set heater_wait = (target_bed - 70)*60*1000/7 | int %}
    #RESPOND MSG="Waiting bed heated {heater_wait/1000 | int } seconds...."
    #G4 P{heater_wait}
    #{% endif %}

    #RESPOND MSG="Waiting bed heated 5 minutes...."
    #G4 P{ 5*60*1000 }

    {%- if target_chamber > 0  %}
      NEVERMORE_ON
      #RESPOND MSG="Waiting chamber temperature reached {target_chamber}...."
      #TEMPERATURE_WAIT SENSOR="temperature_fan chamber" MINIMUM={target_chamber}
      SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber target={target_chamber} min_speed=0.1 max_speed=1
    {%- endif %}
    
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_hold_temp}
    
    RESPOND MSG="Homing z...."
    G28 Z
    
    BED_MESH_CALIBRATE ADAPTIVE=1

    PARK_WASTE

    RESPOND MSG="Heating extruder to {target_extruder}...."
    M109 S{target_extruder}
    RESPOND MSG="Waiting 3 min for thermal expansion...."
    G4 P180000 # Wait 3 min for thermal expansion

    LED_PRINTING

    #PURGE_LINE
    CLEAN_NOZZLE EXTRUDE=true
    SET_GCODE_OFFSET Z_ADJUST={ z_offset } MOVE=1
    RESPOND MSG="Starting print...."


[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: FORCE_QUAD_GANTRY_LEVEL
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            RESPOND MSG="Homing xyz...."
            G28 ; home if not already homed
        {% endif %}
        RESPOND MSG="Gantry leveling...."
        FORCE_QUAD_GANTRY_LEVEL
        RESPOND MSG="Homing z...."
        G28 Z
    {% endif %}

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament

    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F6000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    PARK_WASTE                     ; park nozzle at waste bin
    BED_MESH_CLEAR

    LED_OFF
    CHAMBER_LIGHT_OFF

    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber target=0

    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

[idle_timeout]
timeout: 3600
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber target=0
    TURN_OFF_HEATERS
    M84 # turn off motors
    CHAMBER_LIGHT_OFF
    BED_MESH_CLEAR
    LED_OFF

