[gcode_macro FAN_TOGGLE]
description: Toggle a fan_generic on/off by NAME
# Toggle a fan_generic by NAME (e.g. NAME=nevermore)
gcode:
    {% set name = params.NAME %}
    {% if printer["fan_generic " ~ name].speed > 0 %}
        FAN_OFF NAME={name}
    {% else %}
        FAN_ON NAME={name}
    {% endif %}


[gcode_macro FAN_ON]
description: Turn a fan_generic on at full speed by NAME
# Turn a fan_generic on at full speed
gcode:
    {% set name = params.NAME %}
    RESPOND MSG="Enabling {name}..."
    SET_FAN_SPEED FAN={name} SPEED=1    ; full speed


[gcode_macro FAN_OFF]
description: Turn a fan_generic off by NAME
# Turn a fan_generic off
gcode:
    {% set name = params.NAME %}
    RESPOND MSG="Disabling {name}..."
    SET_FAN_SPEED FAN={name} SPEED=0    ; stop fan
