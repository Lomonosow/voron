[gcode_macro FAN_TOGGLE]
gcode:
    {% set name = params.NAME %}
    {% set status = printer["fan_generic " ~ name].speed %}
    {% if status > 0 %}
        FAN_OFF NAME={name}
    {% else %}
        FAN_ON NAME={name}
    {% endif %}

[gcode_macro FAN_ON]
gcode:
    {% set name = params.NAME %}
    RESPOND MSG="Enabling {name}...."
    SET_FAN_SPEED FAN={name} SPEED=1

[gcode_macro FAN_OFF]
gcode:
    {% set name = params.NAME %}
    RESPOND MSG="Disabling {name}...."
    SET_FAN_SPEED FAN={name} SPEED=0
