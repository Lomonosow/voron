[gcode_macro PAUSE]
description: Pause print: retract, lift Z, park at purge bucket
rename_existing: BASE_PAUSE
gcode:
    {% set Z = params.Z | default(20) | float %}
    {% if not printer.pause_resume.is_paused %}
        # --- flush move buffer before pausing ---
        M400                       ; wait for all moves to complete
        SAVE_GCODE_STATE NAME=PAUSE_state
        BASE_PAUSE

        # --- retract slightly to relieve pressure ---
        M83                        ; relative extrusion
        G91                        ; relative positioning
        G92 E0                     ; reset extruder position
        G1 E-0.8 F2700             ; short retract to cut filament string

        # --- lift Z to clear the print ---
        G1 Z{Z} F1800              ; raise Z by requested amount

        # --- park at purge bucket ---
        G90                        ; absolute positioning
        PARK_WASTE

        # --- longer retract to prevent ooze while parked ---
        G91                        ; relative positioning
        G1 E-10 F1800              ; retract 10mm
        G90                        ; absolute positioning
        LED_COOLING
    {% endif %}


[gcode_macro RESUME]
description: Resume print: wait for hotend temp, restore position
rename_existing: BASE_RESUME
gcode:
    {% if not printer.pause_resume.is_paused %}
        { action_respond_info("Print is not paused, resume aborted") }
    {% else %}
        # --- guard against resuming with a cold nozzle ---
        {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp %}
        {% if printer.extruder.temperature < min_temp %}
            RESPOND MSG="Waiting for extruder to reach {min_temp}C..."
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={min_temp}    ; wait before restoring
        {% endif %}

        RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=200    ; return to paused position
        LED_PRINTING
        BASE_RESUME
    {% endif %}


[gcode_macro CANCEL_PRINT]
description: Cancel print: lift Z, turn off heaters, park, clean state
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set Z_LIFT    = params.Z_LIFT | default(20) | float %}
    {% set CURRENT_Z = printer.gcode_move.gcode_position.z %}

    # --- safe Z lift without exceeding axis limit ---
    {% if 'z' in printer.toolhead.homed_axes and Z_LIFT > 0 %}
        {% set MAX_LIFT = ([Z_LIFT, printer.toolhead.axis_maximum.z - CURRENT_Z] | min) %}
        {% if MAX_LIFT > 0 %}
            M400               ; wait for moves to complete
            G91                ; relative positioning
            G1 Z{MAX_LIFT} F3000   ; lift Z
            G90                ; absolute positioning
        {% endif %}
    {% endif %}

    # --- shutdown heaters and fans ---
    TURN_OFF_HEATERS
    M107               ; turn off part cooling fan

    # --- park and clean state ---
    G90                ; absolute positioning
    PARK_WASTE
    BED_MESH_CLEAR
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber target=0    ; disable chamber fan control
    LED_OFF
    CHAMBER_LIGHT_OFF
    {action_respond_info('action:cancel')}
