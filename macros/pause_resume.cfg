[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set Z = params.Z|default(20)|float %}

    {% if not printer.pause_resume.is_paused %}
        M400
        SAVE_GCODE_STATE NAME=PAUSE_state
        BASE_PAUSE
        M83
        G91
        G92 E0
        G1 E-0.8 F2700          ; quick retract to stop ooze
        G1 Z{Z} F1800           ; lift
        G90
        PARK_WASTE
        G91
        G1 E-10 F1800           ; long retract
        G90
        LED_COOLING
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% if not printer.pause_resume.is_paused %}
        { action_respond_info("Print is not paused, resume aborted") }
    {% else %}
        {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp %}
        {% if printer.extruder.temperature < min_temp %}
            RESPOND MSG="Waiting for extruder to reach {min_temp}C..."
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={min_temp}
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=200
        LED_PRINTING
        BASE_RESUME
    {% endif %}

[gcode_macro PRINT_CANCEL]
gcode:
    {% set Z_LIFT = params.Z_LIFT|default(20)|float %}
    {% set CURRENT_Z = printer.gcode_move.gcode_position.z %}

    {% if 'z' in printer.toolhead.homed_axes and Z_LIFT > 0 %}
        {% set MAX_LIFT = ([Z_LIFT, printer.toolhead.axis_maximum.z - CURRENT_Z]|min) %}
        {% if MAX_LIFT > 0 %}
            M400
            G91
            G1 Z{MAX_LIFT} F3000
            G90
        {% endif %}
    {% endif %}

    TURN_OFF_HEATERS
    M107
    G90
    PARK_WASTE
    BED_MESH_CLEAR
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber target=0
    LED_OFF
    CHAMBER_LIGHT_OFF
    {action_respond_info('action:cancel')}
