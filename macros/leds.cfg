# Toolhead LED color presets (GRBW neopixel)

[gcode_macro LED_OFF]
description: Turn off toolhead LED
gcode:
    SET_LED LED="toolhead_light" RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1    ; all off

[gcode_macro LED_HOMING]
description: Set toolhead LED to blue (homing)
gcode:
    SET_LED LED="toolhead_light" RED=0 GREEN=0 BLUE=1 WHITE=0 SYNC=0 TRANSMIT=1    ; blue

[gcode_macro LED_HEATING]
description: Set toolhead LED to red (heating)
gcode:
    SET_LED LED="toolhead_light" RED=1 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1    ; red

[gcode_macro LED_PRINTING]
description: Set toolhead LED to white (printing)
gcode:
    SET_LED LED="toolhead_light" RED=1 GREEN=1 BLUE=1 WHITE=0 SYNC=0 TRANSMIT=1    ; white (RGB mix)

[gcode_macro LED_COOLING]
description: Set toolhead LED to green (cooling/paused)
gcode:
    SET_LED LED="toolhead_light" RED=0 GREEN=1 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1    ; green


# Chamber case light (PWM output pin)

[gcode_macro CHAMBER_LIGHT_ON]
description: Turn on chamber case light; optional VALUE=0.0-1.0
variable_pin_name: "caselight"
gcode:
    {% set value = params.VALUE | default(1.0) | float %}
    SET_PIN PIN={pin_name} VALUE={value}    ; set brightness (0.0 - 1.0)

[gcode_macro CHAMBER_LIGHT_OFF]
description: Turn off chamber case light
variable_pin_name: "caselight"
gcode:
    SET_PIN PIN={pin_name} VALUE=0    ; turn off

[gcode_macro CHAMBER_LIGHT_TOGGLE]
description: Toggle chamber case light on/off
variable_pin_name: "caselight"
gcode:
    {% if printer["output_pin " ~ pin_name].value > 0 %}
        CHAMBER_LIGHT_OFF
    {% else %}
        CHAMBER_LIGHT_ON
    {% endif %}
