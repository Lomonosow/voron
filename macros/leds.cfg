[gcode_macro LED_OFF]
gcode:
    SET_LED LED="toolhead_light" RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_HOMING]
gcode:
    SET_LED LED="toolhead_light" RED=0 GREEN=0 BLUE=1 WHITE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_HEATING]
gcode:
    SET_LED LED="toolhead_light" RED=1 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_PRINTING]
gcode:
    SET_LED LED="toolhead_light" RED=1 GREEN=1 BLUE=1 WHITE=0 SYNC=0 TRANSMIT=1

[gcode_macro LED_COOLING]
gcode:
    SET_LED LED="toolhead_light" RED=0 GREEN=1 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1

[gcode_macro CHAMBER_LIGHT_ON]
variable_pin_name: "caselight"
description: "Turn on chamber light"
gcode:
    {% set value = params.VALUE | default(1.0) | float %}
    RESPOND MSG="Enabling chamber light {value * 100 }%...."
    SET_PIN PIN={pin_name} VALUE={value}

[gcode_macro CHAMBER_LIGHT_OFF]
variable_pin_name: "caselight"
description: "Turn off chamber light"
gcode:
    RESPOND MSG="Disabling chamber light...."
    SET_PIN PIN={pin_name} VALUE=0

[gcode_macro CHAMBER_LIGHT_TOGGLE]
description: "Toggle chamber light"
variable_pin_name: "caselight"
gcode:
    {% set status = printer["output_pin " ~ pin_name].value %}
    {% if status > 0 %}
    CHAMBER_LIGHT_OFF
    {% else %}
    CHAMBER_LIGHT_ON
    {% endif %}
