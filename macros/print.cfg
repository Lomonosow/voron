[gcode_macro PURGE_LINE]
description: Draw a purge line along the front-left edge of the bed
gcode:
    SAVE_GCODE_STATE NAME=STATE_PURGE_LINE
    RESPOND MSG="Purge line..."
    # --- draw a purge line along the front-left edge ---
    G92 E0                          ; reset extruder position
    G1 X20 Y20 Z0.3 F5000          ; move to purge start point
    G1 X200 Y20 Z0.3 F1500.0 E15   ; extrude purge line
    RESTORE_GCODE_STATE NAME=STATE_PURGE_LINE MOVE=0


[gcode_macro PRINT_START]
description: Full print start sequence; called by slicer with BED, EXTRUDER, CHAMBER, Z_OFFSET
variable_extruder_hold_temp: 140
gcode:
    # --- slicer parameters ---
    {% set target_bed      = params.BED      | int %}
    {% set target_extruder = params.EXTRUDER | int %}
    {% set target_chamber  = params.CHAMBER  | default(0) | int %}
    {% set z_offset        = params.Z_OFFSET | default(0) | float %}

    # --- initial state ---
    BED_MESH_CLEAR
    CHAMBER_LIGHT_ON
    LED_HOMING

    # --- preheat hotend to hold temp to avoid cold-pull on first move ---
    {% if extruder_hold_temp %}
        RESPOND MSG="Heating extruder to {extruder_hold_temp}C..."
        M104 S{extruder_hold_temp}    ; preheat hotend (no wait)
    {% endif %}

    # keep bed warm if it was already heated from a previous print
    {% if printer.heater_bed.temperature > 30 %}
        M140 S{ printer.heater_bed.temperature }    ; maintain current bed temp (no wait)
    {% endif %}

    # --- home if needed, then level gantry ---
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Homing..."
        G28    ; home all axes
    {% endif %}
    QUAD_GANTRY_LEVEL

    # --- move to heat-soak position ---
    G90                         ; absolute positioning
    PARK_START
    LED_HEATING

    # --- heat bed ---
    RESPOND MSG="Heating bed to {target_bed}C..."
    M190 S{target_bed}          ; wait for bed temperature

    # --- start chamber fans if chamber target is set ---
    {% if target_chamber > 0 %}
        FAN_ON NAME=nevermore
        FAN_ON NAME=evenmore
        SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber target={target_chamber} min_speed=0.1 max_speed=1
    {% endif %}

    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_hold_temp}    ; ensure hotend reached hold temp

    # --- Z homing and adaptive mesh ---
    RESPOND MSG="Homing Z..."
    G28 Z                       ; home Z at final bed temperature
    BED_MESH_CALIBRATE ADAPTIVE=1

    # --- final heat & soak ---
    PARK_WASTE
    RESPOND MSG="Heating extruder to {target_extruder}C..."
    M109 S{target_extruder}     ; wait for hotend to reach print temperature
    RESPOND MSG="Waiting 3 min for thermal expansion..."
    G4 P180000                  ; dwell 3 minutes for frame expansion

    # --- clean and start ---
    LED_PRINTING
    #PURGE_LINE
    CLEAN_NOZZLE EXTRUDE=true
    SET_GCODE_OFFSET Z_ADJUST={z_offset} MOVE=1    ; apply per-print Z offset from slicer
    RESPOND MSG="Starting print..."


[gcode_macro PRINT_END]
description: Print end sequence: retract, park, cool down, clean state
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    # --- retract and wipe move to avoid blobs ---
    M400                       ; wait for all moves to complete
    G92 E0                     ; reset extruder position
    G1 E-10.0 F3600            ; retract 10mm at speed

    # --- Z lift with simultaneous XY wipe ---
    G91                        ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F6000    ; lift Z 1mm while wiping

    # --- cool down ---
    TURN_OFF_HEATERS
    M107                       ; turn off part cooling fan

    # --- final park ---
    G1 Z2 F3000                ; additional Z lift
    G90                        ; absolute positioning
    PARK_WASTE

    # --- cleanup ---
    BED_MESH_CLEAR
    LED_OFF
    CHAMBER_LIGHT_OFF
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber target=0    ; disable chamber fan control
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
