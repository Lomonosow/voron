[gcode_macro CALIBRATE_ALL]
description: Full calibration: PID (optional), input shaper, bed mesh, save config
variable_probe_temp: 150
gcode:
    {% set hotend_temp = params.HOTEND|default(260)|int %}
    {% set bed_temp    = params.BED|default(110)|int %}
    {% set do_pid      = params.PID|default(False)|bool %}

    RESPOND MSG="=== CALIBRATE_ALL starting ==="
    CHAMBER_LIGHT_ON
    LED_HEATING

    # --- optional PID tuning (runs first, before any mesh or shaper data) ---
    {% if do_pid %}
        RESPOND MSG="[PID 1/2] Heating hotend to {hotend_temp}C..."
        M106 S255              ; part fan on to simulate print cooling
        M109 S{hotend_temp}    ; wait for hotend
        RESPOND MSG="[PID 1/2] Calibrating extruder PID..."
        PID_CALIBRATE HEATER=extruder TARGET={hotend_temp}
        M106 S0                ; turn off part fan
        M104 S{probe_temp}     ; begin cooldown to probe temp (no wait)

        RESPOND MSG="[PID 2/2] Heating bed to {bed_temp}C..."
        M190 S{bed_temp}       ; wait for bed
        RESPOND MSG="[PID 2/2] Calibrating bed PID..."
        PID_CALIBRATE HEATER=heater_bed TARGET={bed_temp}
        M140 S{bed_temp}       ; hold bed at target after PID
    {% endif %}

    # --- heat to calibration temperatures ---
    RESPOND MSG="Heating to calibration temperatures..."
    M104 S{probe_temp}         ; preheat hotend to probe temp (no wait)
    M190 S{bed_temp}           ; wait for bed
    M109 S{probe_temp}         ; wait for hotend

    # --- home and level ---
    LED_HOMING
    RESPOND MSG="Homing all axes..."
    G28                        ; home XYZ
    RESPOND MSG="Leveling gantry..."
    FORCE_QUAD_GANTRY_LEVEL    ; level gantry (bypass smart wrapper to always run)
    G28 Z                      ; re-home Z after leveling

    # --- input shaper calibration ---
    RESPOND MSG="Running input shaper calibration..."
    SHAPER_CALIBRATE           ; measure resonances and apply best shaper (pending SAVE_CONFIG)

    # --- bed mesh calibration ---
    RESPOND MSG="Running full bed mesh calibration..."
    BED_MESH_CALIBRATE         ; full 9x9 mesh (pending SAVE_CONFIG)

    # --- cool down and save ---
    RESPOND MSG="Calibration complete - cooling down..."
    TURN_OFF_HEATERS
    LED_OFF
    CHAMBER_LIGHT_OFF
    FAN_OFF NAME=nevermore
    FAN_OFF NAME=evenmore
    RESPOND MSG="=== Saving config - Klipper will restart ==="
    SAVE_CONFIG                ; write all pending values (PID, shaper, mesh) and restart
