[gcode_macro CALIBRATE_ALL]
description: Full calibration sequence: PID (optional), input shaper, bed mesh, save
variable_probe_temp: 150
gcode:
    {% set hotend_temp = params.HOTEND | default(260) | int %}
    {% set bed_temp    = params.BED    | default(110) | int %}
    {% set do_pid      = params.PID    | default(0)   | int %}

    RESPOND MSG="=== CALIBRATE_ALL starting ==="
    CHAMBER_LIGHT_ON
    LED_HEATING

    # ------------------------------------------------------------------ #
    # Optional PID calibration
    # ------------------------------------------------------------------ #
    {% if do_pid %}
        RESPOND MSG="[PID 1/2] Heating hotend to {hotend_temp}C..."
        M106 S255                               ; part fan on — simulate print conditions
        M109 S{hotend_temp}
        RESPOND MSG="[PID 1/2] Calibrating extruder PID..."
        PID_CALIBRATE HEATER=extruder TARGET={hotend_temp}
        M106 S0
        M104 S{probe_temp}                      ; start cooling to probe temp

        RESPOND MSG="[PID 2/2] Heating bed to {bed_temp}C..."
        M190 S{bed_temp}
        RESPOND MSG="[PID 2/2] Calibrating bed PID..."
        PID_CALIBRATE HEATER=heater_bed TARGET={bed_temp}
        M140 S{bed_temp}                        ; keep bed at target after tune
    {% endif %}

    # ------------------------------------------------------------------ #
    # Heat to calibration temperatures
    # ------------------------------------------------------------------ #
    RESPOND MSG="Heating to calibration temperatures..."
    M104 S{probe_temp}
    M190 S{bed_temp}
    M109 S{probe_temp}

    # ------------------------------------------------------------------ #
    # Home and level gantry
    # ------------------------------------------------------------------ #
    LED_HOMING
    RESPOND MSG="Homing all axes..."
    G28
    RESPOND MSG="Leveling gantry..."
    FORCE_QUAD_GANTRY_LEVEL
    G28 Z

    # ------------------------------------------------------------------ #
    # Input shaper calibration
    # Auto-measures X and Y resonance, applies best shaper type and frequency
    # ------------------------------------------------------------------ #
    RESPOND MSG="Running input shaper calibration (takes a few minutes)..."
    SHAPER_CALIBRATE

    # ------------------------------------------------------------------ #
    # Full bed mesh
    # ------------------------------------------------------------------ #
    RESPOND MSG="Running full bed mesh calibration..."
    BED_MESH_CALIBRATE

    # ------------------------------------------------------------------ #
    # Save everything and restart
    # Saves: PID values (if tuned), input shaper, bed mesh
    # ------------------------------------------------------------------ #
    RESPOND MSG="Calibration complete — cooling down..."
    TURN_OFF_HEATERS
    LED_OFF
    CHAMBER_LIGHT_OFF
    FAN_OFF NAME=nevermore
    FAN_OFF NAME=evenmore
    RESPOND MSG="=== Saving config — Klipper will restart ==="
    SAVE_CONFIG
