[homing_override]
axes: xyz
set_position_z: 0
gcode:
    # --- safe Z lift before any move ---
    G90                    ; absolute positioning
    G0 Z10 F1800           ; lift Z to avoid bed collision

    # --- determine which axes to home ---
    {% set home_x   = "X" in params %}
    {% set home_y   = "Y" in params %}
    {% set home_z   = "Z" in params %}
    {% set home_all = not home_x and not home_y and not home_z %}

    # --- home X / Y via sensorless (SGT) ---
    {% if "x" not in printer.toolhead.homed_axes or home_x %}
        G28 X              ; home X axis
    {% endif %}
    {% if "y" not in printer.toolhead.homed_axes or home_y %}
        G28 Y              ; home Y axis
    {% endif %}

    # --- home Z: move to print-object center for Tap accuracy ---
    {% if home_z or home_all %}
        {% if printer.exclude_object.objects %}
            # center of bounding box around all objects on the plate
            {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
            {% set x_center = ((all_points | map(attribute=0) | min) + (all_points | map(attribute=0) | max)) / 2 %}
            {% set y_center = ((all_points | map(attribute=1) | min) + (all_points | map(attribute=1) | max)) / 2 %}
        {% else %}
            # no objects: fall back to bed center
            {% set x_center = printer.toolhead.axis_maximum.x / 2 %}
            {% set y_center = printer.toolhead.axis_maximum.y / 2 %}
        {% endif %}
        G0 X{x_center} Y{y_center} F6000  ; move to probe position
        G28 Z                              ; home Z with Tap
        G0 Z10 F1800                       ; raise after homing
    {% endif %}


[gcode_macro HOME]
description: Home all axes
gcode:
    G28    ; home all axes


[gcode_macro Z_OFFSET_CALIBRATION]
description: Measure Z offset drift across a bed temperature range
gcode:
    # --- parameters ---
    {%- set bed_temp_start = params.START_BED_TEMP | default(30)  | int %}
    {%- set bed_temp_end   = params.END_BED_TEMP   | default(110) | int %}
    {%- set bed_temp_step  = params.BED_TEMP_STEP  | default(10)  | int %}
    {%- set probe_samples  = params.PROBE_SAMPLES  | default(10)  | int %}

    # --- initial heat & homing ---
    {% if printer.heater_bed.temperature > 30 %}
        M140 S{ printer.heater_bed.temperature }   ; hold bed temp if already warm
    {% endif %}
    M104 S140                    ; preheat hotend to probe temp (no wait)
    G28 X Y                      ; home X and Y
    G1 X175 Y175 F6000           ; move to bed center
    M109 S140                    ; wait for hotend to reach probe temp
    G28 Z                        ; home Z
    FORCE_QUAD_GANTRY_LEVEL      ; level gantry
    G28 Z                        ; re-home Z after leveling

    # --- sweep through bed temperatures ---
    {% for bed_temp in range(bed_temp_start, bed_temp_end, bed_temp_step) %}
        G1 X175 Y175 Z20 F6000       ; move to center at safe height
        PROBE SAMPLES={ probe_samples }
        G1 Z5                        ; raise after probe
        M190 S{ bed_temp }           ; wait for bed temperature
        G28 Z                        ; home Z at new temperature

        # probe every minute for 10 minutes to track drift
        {% for i in range(0, 11) %}
            RESPOND MSG="Probing after {i} minutes at {bed_temp}C"
            PROBE SAMPLES={ probe_samples }
            G1 Z5                    ; raise after probe
            G4 P60000                ; wait 1 minute
        {% endfor %}
    {% endfor %}

    # --- done ---
    M400                 ; wait for all moves to complete
    TURN_OFF_HEATERS
