[homing_override]
axes: xyz
set_position_z: 0
gcode:
    G90
    G0 Z10 F1800
    {% set should_park_x = "X" in params %}
    {% set should_park_y = "Y" in params %}
    {% set should_park_z = "Z" in params %}
    {% set should_park_all = not should_park_x and not should_park_y and not should_park_z %}
    {% if "x" not in printer.toolhead.homed_axes or should_park_x %}
        G28 X
    {% endif %}
    {% if "y" not in printer.toolhead.homed_axes or should_park_y %}
        G28 Y
    {% endif %}
    {% if should_park_z or should_park_all %}
        {% if printer.exclude_object.objects %}
            {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
            {% set x_center = ((all_points | map(attribute=0) | min) + (all_points | map(attribute=0) | max)) / 2 %}
            {% set y_center = ((all_points | map(attribute=1) | min) + (all_points | map(attribute=1) | max)) / 2 %}
        {% else %}
            {% set x_center = printer.toolhead.axis_maximum.x / 2 %}
            {% set y_center = printer.toolhead.axis_maximum.y / 2 %}
        {% endif %}
        G0 X{x_center} Y{y_center} F6000
        G28 Z
        G0 Z10 F1800
    {% endif %}

[gcode_macro HOME]
gcode:
    G28

[gcode_macro Z_OFFSET_CALIBRATION]
gcode:
    {%- set bed_temp_start = params.START_BED_TEMP | default(30) | int %}
    {%- set bed_temp_end = params.END_BED_TEMP | default(110) | int %}
    {%- set bed_temp_step = params.BED_TEMP_STEP | default(10) | int %}
    {%- set probe_samples = params.PROBE_SAMPLES | default(10) | int %}

    {% if printer.heater_bed.temperature > 30 %} # Stabilize bed temperature
    M140 S{ printer.heater_bed.temperature }
    {% endif %}

    M104 S140
    G28 X Y
    G1 X175 Y175 F6000

    M109 S140
    G28 Z
    FORCE_QUAD_GANTRY_LEVEL
    G28 Z

    {% for bed_temp in range(bed_temp_start, bed_temp_end, bed_temp_step) %}
        G1 X175 Y175 Z20 F6000
        PROBE SAMPLES={ probe_samples }
        G1 Z5
        M190 S{ bed_temp }
        G28 Z

        {% for i in range(0, 11) %}
            RESPOND MSG="Probing after {i} minutes at temp { bed_temp }"
            PROBE SAMPLES={ probe_samples }
            G1 Z5
            G4 P60000
        {% endfor %}
    {% endfor %}

    M400
    TURN_OFF_HEATERS
