[gcode_macro PREHEAT_ASA]
description: Preheat bed and chamber to ASA conditions (bed 100C, chamber 45C)
# Heat chamber to 45C before printing ASA; hotend held at 150C to avoid ooze
gcode:
    M104 S150              ; preheat hotend to safe temp (no wait)
    FAN_ON NAME=nevermore
    FAN_ON NAME=evenmore
    M190 S100              ; wait for bed to reach 100C
    TEMPERATURE_WAIT SENSOR="temperature_fan chamber" MINIMUM=45    ; wait for chamber
