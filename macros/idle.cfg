[idle_timeout]
timeout: 600
gcode:
    # --- shutdown sequence on idle timeout ---
    FAN_OFF NAME=nevermore
    FAN_OFF NAME=evenmore
    FAN_OFF NAME=exhaust
    SET_CHAMBER_TEMP TARGET=0    ; disable chamber fan control
    TURN_OFF_HEATERS
    M84               ; disable steppers
    CHAMBER_LIGHT_OFF
    BED_MESH_CLEAR
    LED_OFF
