[gcode_macro PARK_WASTE]
description: Park toolhead at purge bucket
# Park at purge bucket; coordinates mirror CLEAN_NOZZLE variables
gcode:
    G90                                                                          ; absolute positioning
    G1 X{ printer["gcode_macro CLEAN_NOZZLE"].start_x } Y{ printer["gcode_macro CLEAN_NOZZLE"].start_y } F6000  ; move to bucket XY


[gcode_macro PARK_START]
description: Park toolhead at bed center during heat-up
# Safe park position used during heat-up before a print
gcode:
    G90               ; absolute positioning
    G1 X175 Y175 Z20 F6000  ; move to bed center at safe Z
