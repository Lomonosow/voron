[gcode_macro CLEAN_NOZZLE]
description: Wipe nozzle on purge bucket; pass EXTRUDE=true to purge before wiping
# Purge bucket position and wipe geometry
variable_start_x: 210
variable_start_y: 350
variable_end_y: 348
variable_start_z: 2.5
variable_end_z: 2.5
variable_wipe_dist: -60
variable_wipe_qty: 5
variable_wipe_spd: 200       ; mm/s
variable_raise_distance: 10
gcode:
    # --- ensure machine is homed ---
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28    ; home all axes if not already homed
    {% endif %}

    # --- move to bucket ---
    G90                                    ; absolute positioning
    G1 X{start_x} Y{start_y} F6000        ; move to bucket entry point
    G1 Z{start_z} F1500                    ; lower to wipe height

    # --- optional purge before wiping ---
    {% if params.EXTRUDE | lower == "true" %}
        {% if printer.extruder.can_extrude | lower == 'true' %}
            M83               ; relative extrusion
            G1 E+20 F120      ; purge 20mm of filament
            M82               ; back to absolute extrusion
        {% endif %}
    {% endif %}

    # --- return to start, then wipe ---
    G1 X{start_x} Y{start_y} F6000        ; reposition at bucket start

    # wipe pass: gradually shift Y and Z across each stroke
    {% for wipes in range(0, wipe_qty) %}
        {% set y = start_y - (start_y - end_y) / wipe_qty * wipes %}
        {% set z = start_z - (start_z - end_z) / wipe_qty * wipes %}
        G1 X{start_x + wipe_dist} Y{y} Z{z} F{wipe_spd * 60}  ; stroke forward
        G1 X{start_x} F{wipe_spd * 60}                         ; stroke back
    {% endfor %}

    # --- raise after wipe ---
    G1 Z{raise_distance}    ; lift nozzle clear of bucket
